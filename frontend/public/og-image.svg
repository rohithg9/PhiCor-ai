<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="200" fill="#6366f1" opacity="0.1"/>
  <circle cx="1000" cy="480" r="250" fill="#a855f7" opacity="0.1"/>
  <circle cx="600" cy="315" r="300" fill="#ec4899" opacity="0.05"/>
  
  <!-- Logo container -->
  <rect x="520" y="120" width="80" height="80" rx="16" fill="#1a1a2e" stroke="#6366f1" stroke-width="2" opacity="0.8"/>
  <text x="560" y="180" font-family="Georgia, serif" font-size="55" font-weight="bold" fill="url(#phiGrad)" text-anchor="middle">Φ</text>
  
  <!-- Brand name -->
  <text x="620" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="url(#textGrad)">PhiCor.ai</text>
  
  <!-- Main headline -->
  <text x="600" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" text-anchor="middle">Decoding the</text>
  <text x="600" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" text-anchor="middle">Equations of Life.</text>
  
  <!-- Tagline -->
  <text x="600" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#9ca3af" text-anchor="middle">Moving medicine from speculation to calculation.</text>
  <text x="600" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#6366f1" text-anchor="middle">Aerospace-grade precision for human physiology.</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#6366f1" opacity="0.3"/>
  <text x="600" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">Digital Physiology Platform • phicor.ai</text>
</svg>
